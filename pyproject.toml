[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tpms-relearn"
version = "0.1.0"
description = "Read and register Toyota TPMS sensor IDs through a Bluetooth ELM327 adapter"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["bleak>=1.0,<4", "pyserial>=3.5,<4"]
keywords = ["toyota", "lexus", "tpms", "relearn", "obd", "elm327", "ble"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
tpms-relearn = "tpms_relearn.cli:main"

[tool.setuptools.packages.find]
include = ["tpms_relearn*"]
